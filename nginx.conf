server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'" always;
    # Nur auf Serverebene: ein add_header im location-Block hebt diese hier auf.
    add_header Cache-Control "no-cache" always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
